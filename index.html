<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgegapDle</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="min-h-screen bg-[#050505] text-white">
    <main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col justify-center px-4 py-5 sm:px-6 lg:px-8">
      <header class="mb-5 text-center">
        <div class="inline-flex items-center gap-3">
          <span class="rounded bg-[#f5c518] px-3 py-2 text-2xl font-black tracking-tight text-black sm:text-4xl">Agegap</span>
          <span class="text-3xl font-black tracking-tight text-white sm:text-5xl">Dle</span>
        </div>
        <div class="mt-5 grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded border border-[#2a2a2a] bg-[#121212] px-3 py-2">
            <span class="block text-[#b3b3b3]">Score</span>
            <strong id="score" class="text-lg text-[#f5c518]">0</strong>
          </div>
          <div class="rounded border border-[#2a2a2a] bg-[#121212] px-3 py-2">
            <span class="block text-[#b3b3b3]">Date</span>
            <strong id="round" class="text-lg text-[#f5c518]">Today</strong>
          </div>
          <div class="rounded border border-[#2a2a2a] bg-[#121212] px-3 py-2">
            <span class="block text-[#b3b3b3]">Guesses</span>
            <strong id="guesses" class="text-lg text-[#f5c518]">3</strong>
          </div>
        </div>
        <button id="archiveButton" class="mt-4 inline-flex items-center gap-2 rounded border border-[#f5c518]/60 bg-[#121212] px-4 py-2 text-sm font-black text-[#f5c518] transition hover:border-[#f5c518] hover:bg-[#1d1d1d] focus:outline-none focus:ring-4 focus:ring-[#f5c518]/30" type="button" aria-haspopup="dialog">
          <svg class="h-5 w-5" aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2" />
            <path d="M16 3v4M8 3v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
          </svg>
          Archive
        </button>
        <p class="mt-3 text-sm font-semibold text-[#b3b3b3]">
          Countdown to next game: <span id="countdown" class="text-[#f5c518]">--:--:--</span>
        </p>
      </header>

      <section class="mx-auto w-full">
        <article class="overflow-hidden rounded border border-[#2a2a2a] bg-[#121212] shadow-2xl shadow-black/70">
          <div class="relative aspect-[4/3] bg-black">
            <img id="coupleImage" class="h-full w-full object-contain" alt="" />
            <div class="absolute inset-x-0 bottom-0 border-t border-[#f5c518]/40 bg-gradient-to-t from-black via-black/80 to-transparent p-4 sm:p-6">
              <h2 id="coupleName" class="text-2xl font-black tracking-tight sm:text-4xl"></h2>
            </div>
          </div>

          <div class="space-y-4 p-4 sm:p-6">
            <div>
              <div class="mb-2 flex items-center justify-between text-sm text-[#b3b3b3]">
                <span id="minLabel">0 years</span>
                <strong id="guessValue" class="rounded bg-[#f5c518] px-3 py-1 text-base text-black">10 years</strong>
                <span id="maxLabel">30 years</span>
              </div>
              <input id="gapSlider" class="age-slider w-full" type="range" min="0" max="30" value="10" step="1" />
            </div>
            <div id="history" class="space-y-2"></div>

            <div class="grid gap-3">
              <button id="checkButton" class="rounded bg-[#f5c518] px-4 py-3 font-black text-black transition hover:bg-[#ffd84d] focus:outline-none focus:ring-4 focus:ring-[#f5c518]/30">
                Check
              </button>
            </div>
          </div>
        </article>
      </section>
    </main>

    <div id="archiveDialog" class="archive-dialog fixed inset-0 z-50 hidden items-center justify-center bg-black/75 px-4 py-6" role="dialog" aria-modal="true" aria-labelledby="archiveTitle">
      <section class="w-full max-w-lg overflow-hidden rounded border border-[#2a2a2a] bg-[#121212] shadow-2xl shadow-black/80">
        <div class="flex items-center justify-between border-b border-[#2a2a2a] px-4 py-3">
          <div class="flex items-center gap-2">
            <span class="inline-flex h-9 w-9 items-center justify-center rounded bg-[#f5c518] text-black">
              <svg class="h-5 w-5" aria-hidden="true" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2" />
                <path d="M16 3v4M8 3v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </span>
            <h2 id="archiveTitle" class="text-xl font-black text-white">Archive</h2>
          </div>
          <button id="archiveCloseButton" class="rounded px-3 py-2 text-2xl leading-none text-[#b3b3b3] transition hover:bg-black hover:text-white focus:outline-none focus:ring-4 focus:ring-[#f5c518]/30" type="button" aria-label="Close archive">
            &times;
          </button>
        </div>
        <div id="archiveList" class="max-h-[65vh] space-y-3 overflow-y-auto p-4"></div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
